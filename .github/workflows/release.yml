name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.2, without v)'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME -replace '^v', '' }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Use a version such as 1.0.2' }
          if (@($version.Split('.') | Where-Object { [long]$_ -gt 65534 }).Count) { throw 'Version components must be <= 65534' }
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists; do not overwrite a published version" }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$version" 2>$null
            if ($LASTEXITCODE -eq 0) { throw 'Tag already exists; use the tag-triggered workflow instead' }
          }
          # A failed lookup is expected for a new version.
          $global:LASTEXITCODE = 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch build dependencies
        run: ./scripts/prepare-ci.ps1
      - name: Build
        run: |
          dotnet build Source/StaminaControl.csproj -c Release "-p:Version=$env:RELEASE_VERSION" "-p:GameManagedPath=$env:GAME_MANAGED_PATH" "-p:BepInExPath=$env:BEPINEX_PATH" "-p:SyncPath=$env:SYNC_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Package and verify
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "artifacts/StaminaControl-$env:RELEASE_VERSION.zip"
          gh release create $env:RELEASE_TAG $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Stamina Control $env:RELEASE_VERSION" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed; inspect the draft before retrying' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
